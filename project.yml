name: AriaSoftphone
options:
  bundleIdPrefix: com.solutions5060
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
targets:
  AriaSoftphone:
    type: application
    platform: iOS
    sources:
      - path: AriaSoftphone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solutions5060.aria
        INFOPLIST_FILE: AriaSoftphone/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AriaSoftphone/Resources/AriaSoftphone.entitlements
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        # A Rust staticlib carries its own objects but not the system libraries
        # its C dependencies need — those arrive as cargo link directives that
        # only apply when cargo itself links, which it does not for a staticlib.
        # So Xcode has to name them:
        #   libc++      whisper.cpp and ggml are C++ (std::runtime_error, ...)
        #   Accelerate  ggml-blas calls vDSP for its BLAS kernels
        # Both are harmless in a build without the AI feature: nothing
        # references them and the linker drops them.
        OTHER_LDFLAGS: -lc++ -framework Accelerate
    dependencies:
      - framework: AriaMobileCore.xcframework
        embed: true
        optional: true
    info:
      path: AriaSoftphone/Resources/Info.plist
      properties:
        NSCameraUsageDescription: "Aria needs camera access to scan your provisioning QR code."
        NSMicrophoneUsageDescription: "Aria needs microphone access to make and receive phone calls."
        NSContactsUsageDescription: "Aria uses your contacts to display caller names and enable quick dialing."
        UIBackgroundModes:
          - voip
          - audio
    preBuildScripts:
      - name: Build Rust Library
        script: |
          if [ -f "${SRCROOT}/build-rust.sh" ]; then
            echo "note: Run ./build-rust.sh manually before building"
          fi
        basedOnDependencyAnalysis: false
