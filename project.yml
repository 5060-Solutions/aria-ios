name: AriaSoftphone
options:
  bundleIdPrefix: com.solutions5060
  developmentLanguage: en
  # Liquid Glass (DESIGN.md): built with the Xcode 27 SDK, running on
  # iOS 26 and later.
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
packages:
  # As-you-type number formatting (libphonenumber metadata): PhoneFormat.swift.
  PhoneNumberKit:
    url: https://github.com/PhoneNumberKit/PhoneNumberKit
    exactVersion: 5.0.15
targets:
  AriaSoftphone:
    type: application
    platform: iOS
    sources:
      - path: AriaSoftphone
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: AriaSoftphone/Bridge/AriaSoftphone-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.solutions5060.aria
        INFOPLIST_FILE: AriaSoftphone/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AriaSoftphone/Resources/AriaSoftphone.entitlements
        # Set by Josh in Xcode or with DEVELOPMENT_TEAM=... on the command
        # line; left empty here so the repo carries no team.
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        # String Catalogs: SwiftUI literals and String(localized:) are
        # extracted at build time into Localizable.xcstrings; Info.plist
        # permission strings live in InfoPlist.xcstrings.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # The version lives here, not in Info.plist: bump MARKETING_VERSION
        # per release and CURRENT_PROJECT_VERSION per upload.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone and iPad. The iPad layout is a sidebar at regular width
        # (SidebarShell); the call screen and dial pad size to the room they
        # have.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # A Rust staticlib carries its own objects but not the system libraries
        # its C dependencies need — those arrive as cargo link directives that
        # only apply when cargo itself links, which it does not for a staticlib.
        # So Xcode has to name them:
        #   libc++      whisper.cpp and ggml are C++ (std::runtime_error, ...)
        #   Accelerate  ggml-blas calls vDSP for its BLAS kernels
        # Both are harmless in a build without the AI feature: nothing
        # references them and the linker drops them.
        OTHER_LDFLAGS: -lc++ -lresolv -framework Accelerate
      # Expanded into aps-environment in the entitlements file: APNs rejects a
      # development-environment token sent to the production service and vice
      # versa, so a Release build must ask for production.
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets:
        - AriaSoftphoneTests
        - AriaSoftphoneUITests
    dependencies:
      # A static library: linked into the app binary, never embedded. An
      # embedded copy would ship a stray .a inside the bundle.
      - framework: AriaMobileCore.xcframework
        embed: false
        optional: true
      - package: PhoneNumberKit
    info:
      path: AriaSoftphone/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aria
        # Every language the app ships (the languages in Localizable.xcstrings
        # and InfoPlist.xcstrings): iOS lists these under Settings > Aria >
        # Language. LocalizationTests keeps this list and the bundle in step.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
          - fr
          - de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: AriaLogo
          UIImageRespectsSafeAreaInsets: true
        # iPhone stays upright; the iPad takes every orientation, which
        # Split View and Slide Over need. There is no UIRequiresFullScreen:
        # CallKit does not need the app full screen (calls run in the
        # system's call UI and the app's own call screen takes whatever
        # window it has), so the app opts in to multitasking.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Aria uses the camera only to scan the setup QR code from your phone system."
        NSMicrophoneUsageDescription: "Aria uses the microphone so the other person can hear you during calls."
        NSBluetoothAlwaysUsageDescription: "Aria uses Bluetooth only if you turn it on in Settings, so your devices can notice each other and hand a call over. It works only while the app is open."
        NSContactsUsageDescription: "Aria shows your contacts so you can search and call them. Your contacts stay on this device."
        # Figtree (OFL, Resources/Fonts/Figtree-OFL.txt): static weights
        # instanced from the desktop's variable font.
        UIAppFonts:
          - Figtree-Light.ttf
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
        UIBackgroundModes:
          - voip
          - audio
        # aria:// setup links and actions; sip:/sips: links from other apps.
        CFBundleURLTypes:
          - CFBundleURLName: com.solutions5060.aria
            CFBundleURLSchemes:
              - aria
          - CFBundleURLName: com.solutions5060.aria.sip
            CFBundleURLSchemes:
              - sip
              - sips
        # CallKit Recents and Siri call-backs arrive as this activity.
        NSUserActivityTypes:
          - INStartCallIntent
    preBuildScripts:
      - name: Build Rust Library
        script: |
          if [ -f "${SRCROOT}/build-rust.sh" ]; then
            echo "note: Run ./build-rust.sh manually before building"
          fi
        basedOnDependencyAnalysis: false

  AriaSoftphoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AriaSoftphoneTests
    dependencies:
      - target: AriaSoftphone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.solutions5060.aria.tests

  # Drives the app in fixture mode (-UITestMode); DEBUG builds only.
  AriaSoftphoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AriaSoftphoneUITests
    dependencies:
      - target: AriaSoftphone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.solutions5060.aria.uitests
        TEST_TARGET_NAME: AriaSoftphone
