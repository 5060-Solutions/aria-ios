name: AriaSoftphone
options:
  bundleIdPrefix: com.solutions5060
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
targets:
  AriaSoftphone:
    type: application
    platform: iOS
    sources:
      - path: AriaSoftphone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solutions5060.aria
        INFOPLIST_FILE: AriaSoftphone/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AriaSoftphone/Resources/AriaSoftphone.entitlements
        # Set by Josh in Xcode or with DEVELOPMENT_TEAM=... on the command
        # line; left empty here so the repo carries no team.
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        # The version lives here, not in Info.plist: bump MARKETING_VERSION
        # per release and CURRENT_PROJECT_VERSION per upload.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone only, portrait only: the call screen and dial pad are laid
        # out for a phone held upright, and iPad would need its own layout.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # A Rust staticlib carries its own objects but not the system libraries
        # its C dependencies need — those arrive as cargo link directives that
        # only apply when cargo itself links, which it does not for a staticlib.
        # So Xcode has to name them:
        #   libc++      whisper.cpp and ggml are C++ (std::runtime_error, ...)
        #   Accelerate  ggml-blas calls vDSP for its BLAS kernels
        # Both are harmless in a build without the AI feature: nothing
        # references them and the linker drops them.
        OTHER_LDFLAGS: -lc++ -framework Accelerate
      # Expanded into aps-environment in the entitlements file: APNs rejects a
      # development-environment token sent to the production service and vice
      # versa, so a Release build must ask for production.
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets:
        - AriaSoftphoneTests
    dependencies:
      # A static library: linked into the app binary, never embedded. An
      # embedded copy would ship a stray .a inside the bundle.
      - framework: AriaMobileCore.xcframework
        embed: false
        optional: true
    info:
      path: AriaSoftphone/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aria
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: AriaLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "Aria uses the camera only to scan the setup QR code from your phone system."
        NSMicrophoneUsageDescription: "Aria uses the microphone so the other person can hear you during calls."
        NSContactsUsageDescription: "Aria shows your contacts so you can search and call them. Your contacts stay on this iPhone."
        UIBackgroundModes:
          - voip
          - audio
        # aria:// setup links and actions; sip:/sips: links from other apps.
        CFBundleURLTypes:
          - CFBundleURLName: com.solutions5060.aria
            CFBundleURLSchemes:
              - aria
          - CFBundleURLName: com.solutions5060.aria.sip
            CFBundleURLSchemes:
              - sip
              - sips
        # CallKit Recents and Siri call-backs arrive as this activity.
        NSUserActivityTypes:
          - INStartCallIntent
    preBuildScripts:
      - name: Build Rust Library
        script: |
          if [ -f "${SRCROOT}/build-rust.sh" ]; then
            echo "note: Run ./build-rust.sh manually before building"
          fi
        basedOnDependencyAnalysis: false

  AriaSoftphoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AriaSoftphoneTests
    dependencies:
      - target: AriaSoftphone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.solutions5060.aria.tests
